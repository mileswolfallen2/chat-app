<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }
    
    .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    .auth-box h1 { text-align: center; margin-bottom: 1.5rem; color: #1a1a1a; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .auth-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .auth-box button:hover { background: #0056b3; }
    .auth-box .switch { text-align: center; margin-top: 1rem; color: #007bff; cursor: pointer; font-size: 14px; }
    .error { color: #dc3545; font-size: 12px; margin-bottom: 8px; display: none; }
    
    .app { display: none; height: 100vh; }
    .sidebar { width: 280px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
    .header h2 { font-size: 18px; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; }
    .user-item:hover { background: #f8f9fa; }
    .user-item.active { background: #e7f3ff; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #007bff; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .user-info { flex: 1; }
    .user-name { font-weight: 500; font-size: 14px; }
    .user-status { font-size: 12px; color: #666; }
    .call-btn { width: 32px; height: 32px; border-radius: 50%; background: #28a745; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    
    .main { flex: 1; display: flex; flex-direction: column; background: white; }
    .chat-header { padding: 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h3 { font-size: 16px; }
    .video-call-btn { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
    .message.sent { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
    .message.received { align-self: flex-start; background: #e9ecef; color: #1a1a1a; border-bottom-left-radius: 4px; }
    
    .message-input { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
    .message-input input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; }
    .message-input button { padding: 10px 24px; background: #007bff; color: white; border: none; border-radius: 24px; cursor: pointer; }
    
    .call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; flex-direction: column; gap: 20px; z-index: 1000; }
    .call-overlay.show { display: flex; }
    .call-overlay video { width: 280px; height: 210px; border-radius: 12px; object-fit: cover; background: #222; }
    .call-overlay .remote-video { width: 560px; height: 420px; }
    .call-overlay h2 { color: white; font-size: 20px; }
    .call-overlay .controls { display: flex; gap: 16px; }
    .call-overlay button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .call-overlay .end-btn { background: #dc3545; color: white; }
    .call-overlay .accept-btn { background: #28a745; color: white; }
    .call-overlay .reject-btn { background: #dc3545; color: white; }
    
    .incoming-call { position: fixed; bottom: 20px; right: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: none; z-index: 1001; }
    .incoming-call.show { display: block; }
    .incoming-call h4 { margin-bottom: 8px; }
    .incoming-call .buttons { display: flex; gap: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>Chat App</h1>
      <div class="error" id="authError"></div>
      <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch" onclick="showRegister()">Don't have an account? Sign up</div>
      </div>
      <div id="registerForm" style="display:none;">
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regDisplayName" placeholder="Display Name">
        <button onclick="register()">Sign Up</button>
        <div class="switch" onclick="showLogin()">Already have an account? Login</div>
      </div>
    </div>
  </div>
  
  <div class="app" id="app">
    <div class="sidebar">
      <div class="header">
        <h2>Chat App</h2>
      </div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="main">
      <div class="chat-header">
        <h3 id="chatTitle">Select a user to start chatting</h3>
        <button class="video-call-btn" id="callBtn" style="display:none;" onclick="startCall()">Video Call</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="message-input" id="messageInput" style="display:none;">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
  
  <div class="call-overlay" id="callOverlay">
    <h2 id="callStatus">In Call</h2>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="controls">
      <button class="end-btn" onclick="endCall()">End Call</button>
    </div>
  </div>
  
  <div class="incoming-call" id="incomingCall">
    <h4>Incoming call from <span id="callerName"></span></h4>
    <div class="buttons">
      <button class="accept-btn" onclick="acceptCall()">Accept</button>
      <button class="reject-btn" onclick="rejectCall()">Reject</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let currentUser = null;
    let selectedUser = null;
    let socket = null;
    let peerConnection = null;
    let currentRoomId = null;
    let incomingCallData = null;
    let localStream = null;
    const serverUrl = window.location.origin;
    
    async function login() {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      
      const res = await fetch(`${serverUrl}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      
      const data = await res.json();
      if (data.error) {
        showError(data.error);
      } else {
        currentUser = data.user;
        initApp();
      }
    }
    
    async function register() {
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const displayName = document.getElementById('regDisplayName').value;
      
      const res = await fetch(`${serverUrl}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, displayName })
      });
      
      const data = await res.json();
      if (data.error) {
        showError(data.error);
      } else {
        showLogin();
      }
    }
    
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }
    
    function showLogin() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }
    
    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }
    
    async function initApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      
      socket = io();
      
      socket.on('connect', () => {
        console.log('Connected to server');
        socket.emit('register', currentUser.id);
      });
      
      socket.on('message', (data) => {
        if (currentRoomId === data.roomId) {
          addMessage(data, data.senderId === currentUser.id);
        }
      });
      
      socket.on('call-incoming', handleIncomingCall);
      socket.on('call-offer', handleCallOffer);
      socket.on('call-answer', handleCallAnswer);
      socket.on('ice-candidate', handleIceCandidate);
      socket.on('call-ended', handleCallEnded);
      socket.on('call-rejected', handleCallRejected);
      
      loadUsers();
    }
    
    async function loadUsers() {
      const res = await fetch(`${serverUrl}/api/users`);
      const { users } = await res.json();
      
      const list = document.getElementById('userList');
      list.innerHTML = users.map(u => `
        <div class="user-item" onclick="selectUser(${u.id}, '${u.displayName}')">
          <div class="avatar">${u.displayName[0].toUpperCase()}</div>
          <div class="user-info">
            <div class="user-name">${u.displayName}</div>
            <div class="user-status">@${u.username}</div>
          </div>
          <button class="call-btn" onclick="event.stopPropagation(); startCallToUser(${u.id})">📹</button>
        </div>
      `).join('');
    }
    
    async function selectUser(userId, displayName) {
      selectedUser = { id: userId, displayName };
      
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.user-item').classList.add('active');
      
      document.getElementById('chatTitle').textContent = displayName;
      document.getElementById('callBtn').style.display = 'block';
      document.getElementById('messageInput').style.display = 'flex';
      
      currentRoomId = [currentUser.id, userId].sort().join('-');
      socket.emit('join-room', currentRoomId);
      
      document.getElementById('messages').innerHTML = '';
      const res = await fetch(`${serverUrl}/api/messages/${currentRoomId}`);
      const { messages } = await res.json();
      messages.forEach(msg => {
        addMessage(msg, msg.senderId === currentUser.id);
      });
    }
    
    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !selectedUser) return;
      
      const data = { roomId: currentRoomId, senderId: currentUser.id, content };
      socket.emit('message', data);
      addMessage(data, true);
      input.value = '';
    }
    
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    
    function addMessage(data, isSent) {
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.textContent = data.content;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
    
    function startCall() {
      if (!selectedUser) return;
      startCallToUser(selectedUser.id);
    }
    
    async function startCallToUser(userId) {
      currentRoomId = `call-${[currentUser.id, userId].sort().join('-')}`;
      socket.emit('call-user', { from: currentUser.id, to: userId, roomId: currentRoomId });
      initiateCall(true, userId);
    }
    
    async function initiateCall(isInitiator, targetId) {
      const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      peerConnection = new RTCPeerConnection(config);
      
      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice-candidate', { to: targetId, candidate: e.candidate, roomId: currentRoomId });
        }
      };
      
      peerConnection.ontrack = (e) => {
        console.log('Received remote track');
        document.getElementById('remoteVideo').srcObject = e.streams[0];
      };
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      } catch (err) {
        console.error('Media error:', err);
        showError('Could not access camera/microphone');
        return;
      }
      
      document.getElementById('callOverlay').classList.add('show');
      document.getElementById('callStatus').textContent = 'Connecting...';
      
      if (isInitiator) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call-offer', { to: targetId, offer: offer, roomId: currentRoomId });
        document.getElementById('callStatus').textContent = 'Calling...';
      }
    }
    
    async function handleIncomingCall(data) {
      console.log('Incoming call from', data.from);
      incomingCallData = data;
      document.getElementById('callerName').textContent = `User ${data.from}`;
      document.getElementById('incomingCall').classList.add('show');
      currentRoomId = data.roomId;
    }
    
    async function acceptCall() {
      document.getElementById('incomingCall').classList.remove('show');
      await initiateCall(false, incomingCallData.from);
      
      if (incomingCallData.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('call-answer', { to: incomingCallData.from, answer: answer, roomId: currentRoomId });
      }
      document.getElementById('callStatus').textContent = 'Connected';
    }
    
    function rejectCall() {
      socket.emit('reject-call', { to: incomingCallData.from });
      document.getElementById('incomingCall').classList.remove('show');
      incomingCallData = null;
    }
    
    async function handleCallOffer(data) {
      console.log('Received offer');
      incomingCallData = data;
      currentRoomId = data.roomId;
      document.getElementById('incomingCall').classList.add('show');
      document.getElementById('callerName').textContent = 'Incoming call';
    }
    
    async function handleCallAnswer(data) {
      console.log('Received answer');
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('callStatus').textContent = 'Connected';
      }
    }
    
    function handleCallRejected() {
      endCall();
      showError('Call rejected');
    }
    
    function handleCallEnded() {
      endCall();
    }
    
    async function handleIceCandidate(data) {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (err) {
          console.error('ICE error:', err);
        }
      }
    }
    
    function endCall() {
      document.getElementById('callOverlay').classList.remove('show');
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      if (currentRoomId && currentRoomId.startsWith('call-')) {
        socket.emit('end-call', { roomId: currentRoomId });
      }
      currentRoomId = null;
    }
  </script>
</body>
</html>
