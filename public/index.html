<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Chat App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-dark: #313338; --bg-darker: #2b2d31; --bg-darkest: #1e1f22; --primary: #5865f2; --primary-hover: #4752c4; --text: #dbdee1; --text-muted: #949ba4; --hover: #3f4147; --accent: #f23f43; --success: #23a559; }
    body { font-family: 'gg sans', 'Segoe UI', Tahoma, sans-serif; background: var(--bg-darkest); color: var(--text); height: 100vh; overflow: hidden; touch-action: manipulation; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar-left { width: 72px; }
      .sidebar-header { display: none; }
      .dm-header { display: none; }
      .user-name { display: none; }
      .user-item { padding: 8px; margin: 2px 4px; justify-content: center; }
      .avatar-wrap { margin: 0; }
      .avatar { width: 40px; height: 40px; font-size: 18px; }
      .status-dot { width: 12px; height: 12px; border-width: 2px; }
      .chat-header { padding: 12px; }
      .chat-header h2 { font-size: 14px; }
      .chat-header .username { display: none; }
      .video-header-btn { padding: 8px 10px; font-size: 12px; }
      .message-avatar { width: 32px; height: 32px; font-size: 12px; }
      .message-group { gap: 10px; }
      .message-header .name { font-size: 13px; }
      .message-text { font-size: 14px; }
      .video-box video { width: 160px; height: 120px; }
      .call-controls { gap: 8px; }
      .call-btn { padding: 10px 14px; font-size: 12px; }
      .call-overlay { gap: 12px; }
      .video-grid { gap: 10px; }
    }
    
    .auth-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-box { background: var(--bg-darker); padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
    .auth-box h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
    .auth-box p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 14px; }
    .auth-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: #1e1f22; border: none; border-radius: 4px; color: var(--text); font-size: 14px; }
    .auth-box input:focus { outline: 2px solid var(--primary); }
    .auth-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .auth-box button:hover { background: var(--primary-hover); }
    .auth-box .switch { margin-top: 1rem; color: var(--primary); font-size: 13px; cursor: pointer; }
    .auth-box .switch:hover { text-decoration: underline; }
    .error { color: var(--accent); font-size: 13px; margin-bottom: 8px; display: none; }
    
    .app { display: none; height: 100vh; }
    .sidebar-left { width: 240px; background: var(--bg-darker); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #1e1f22; font-weight: 600; }
    .dm-header { padding: 12px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 8px 12px; margin: 2px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .user-item:hover { background: var(--hover); }
    .user-item.active { background: #3f4147; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .user-name { font-size: 14px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); position: absolute; bottom: 0; right: 0; border: 3px solid var(--bg-darker); }
    .avatar-wrap { position: relative; video-btn { background: var(--success); color: white; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; } }
    
    .chat-area { flex: 1; background: var(--bg-dark); display: flex; flex-direction: column; }
    .chat-header { padding: 16px; border-bottom: 1px solid #26272d; display: flex; align-items: center; gap: 10px; }
    .chat-header h2 { font-size: 16px; font-weight: 600; }
    .chat-header .username { color: var(--text-muted); font-size: 14px; }
    .video-header-btn { margin-left: auto; background: var(--success); color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: none; }
    .video-header-btn:hover { background: #1c6b42; }
    
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .message-group { display: flex; gap: 16px; padding: 2px 0; }
    .message-group:hover { background: #2e3035; margin: 0 -16px; padding: 2px 16px; }
    .message-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
    .message-content { flex: 1; min-width: 0; }
    .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .message-header .name { font-weight: 600; font-size: 14px; }
    .message-header .time { color: var(--text-muted); font-size: 12px; }
    .message-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .no-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); flex-direction: column; gap: 16px; }
    .no-chat svg { width: 80px; height: 80px; opacity: 0.3; }
    
    .message-input { padding: 16px; }
    .message-input-wrap { background: #383a40; border-radius: 8px; padding: 0 16px; }
    .message-input input { width: 100%; padding: 12px 0; background: transparent; border: none; color: var(--text); font-size: 14px; }
    .message-input input:focus { outline: none; }
    .message-input input::placeholder { color: var(--text-muted); }
    
    .call-overlay { position: fixed; inset: 0; background: #121212; display: none; justify-content: center; align-items: center; flex-direction: column; gap: 20px; z-index: 1000; }
    .call-overlay.show { display: flex; }
    .video-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .video-box { position: relative; }
    .video-box video { width: 480px; height: 360px; border-radius: 8px; object-fit: cover; background: #1a1a1a; }
    .video-box .label { color: #888; margin-bottom: 4px; font-size: 13px; }
    .video-box .status { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 8px; }
    .video-box .status span { background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .video-box .status .off { color: #f23f43; }
    
    .call-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .call-btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .call-btn.end { background: #f23f43; color: white; }
    .call-btn.toggle { background: #4e5058; color: white; }
    .call-btn.toggle.active { background: var(--primary); }
    .call-btn.screen { background: #23a559; color: white; }
    .call-btn.screen.sharing { background: #f23f43; }
    
    .call-header { text-align: center; color: white; }
    .call-header .status { color: #f39c12; margin-top: 8px; font-size: 14px; }
    .call-header .connected { color: #23a559; }
    .call-header .left { color: #f23f43; font-size: 18px; font-weight: bold; }
    .call-header h2 { margin-bottom: 4px; }
    
    .incoming-call { position: fixed; bottom: 20px; right: 20px; background: var(--bg-darker); padding: 20px; border-radius: 8px; z-index: 100; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .incoming-call.show { display: block; }
    .incoming-call h4 { margin-bottom: 8px; }
    .incoming-call-buttons { display: flex; gap: 10px; }
    .incoming-call-btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .incoming-call-btn.accept { background: #23a559; color: white; }
    .incoming-call-btn.reject { background: #4e5058; color: white; }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>Welcome back</h1>
      <p>We're so excited to see you again!</p>
      <div class="error" id="authError"></div>
      <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch" onclick="showRegister()">Need an account?</div>
      </div>
      <div id="registerForm" style="display:none;">
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regDisplayName" placeholder="Display Name (optional)">
        <button onclick="register()">Create Account</button>
        <div class="switch" onclick="showLogin()">Already have an account?</div>
      </div>
    </div>
  </div>
  
  <div class="app" id="app">
    <div class="sidebar-left">
      <div class="sidebar-header">Chat App</div>
      <div class="dm-header">Direct Messages</div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chatHeader" style="display:none;">
        <div class="avatar-wrap">
          <div class="avatar" id="chatAvatar"></div>
          <div class="status-dot"></div>
        </div>
        <div>
          <h2 id="chatTitle">User</h2>
          <div class="username" id="chatUsername">@username</div>
        </div>
        <button class="video-header-btn" id="videoHeaderBtn" onclick="startCall()">📹 Video Call</button>
      </div>
      <div class="messages" id="messages">
        <div class="no-chat" id="noChat">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.88657 21.5C5.38747 21.5 4.95609 21.3 4.61039 20.95L4.61039 20.95C4.26469 20.6042 4.06469 20.1728 4.01039 19.6558C3.95609 19.1388 3.94679 18.4756 3.98239 17.6662L4.00039 17.6662L4.00039 17.6662C4.036 16.8568 4.0961 16.1936 4.18076 15.6766C4.26542 15.1596 4.46725 14.7282 4.78625 14.3825C5.10525 14.0367 5.54114 13.8367 6.09394 13.7823L6.09394 13.7823C6.64674 13.7279 7.23214 13.7322 7.85014 13.7951C8.46814 13.858 9.03494 14.0439 9.55064 14.3528C10.0663 14.6618 10.4552 15.1275 10.7172 15.75L10.7172 15.75L10.7172 15.75C10.9792 16.3725 11.1101 17.1275 11.1101 18.015V18.015C11.1101 19.9185 10.5605 21.472 9.46126 22.6761C8.36206 23.8801 6.74763 24.5 5.88657 24.5V21.5ZM14.5 23C14.5 23 14.5 23 14.5 23V23C13.4 23 12.3933 22.7419 11.4801 22.2257C10.5668 21.7094 9.83836 21.0239 9.29481 20.1692C8.75126 19.3144 8.47949 18.3715 8.47949 17.3404V17.3404C8.47949 15.8054 8.86595 14.4932 9.63888 13.4038C10.4118 12.3144 11.4796 11.5 12.8422 10.9614L12.8422 10.9614C13.4238 10.6758 14.0554 10.536 14.7361 10.5419V10.5419C15.4168 10.5479 16.0421 10.6876 16.6118 10.9612C16.6118 10.9612 16.6118 10.9612 16.6118 10.9612C18.0069 11.4984 19.108 12.3371 19.9155 13.4772C20.7231 14.6173 21.127 15.9742 21.127 17.548V17.548C21.127 18.5937 20.8569 19.5476 20.3167 20.4096C19.7765 21.2717 19.0449 21.9603 18.1218 22.4755C17.1988 22.9907 16.1616 23.2495 15.01 23.252L14.5 23ZM11.4305 0.5L19.3219 4.5L19.3219 9.5L15.5219 11L15.5219 16L19.3219 17.5L19.3219 22.5L11.4305 22.5C9.01252 22.5 6.87028 21.6645 5.00378 19.9935C3.13728 18.3224 2.00065 16.0998 2.00065 13.326C2.00065 10.5522 3.13728 8.32961 5.00378 6.65856C6.87028 5.98751 9.01252 5.5 11.4305 5.5V0.5Z"/></svg>
          <div>Select a user to start chatting</div>
        </div>
      </div>
      <div class="message-input" id="messageInput" style="display:none;">
        <div class="message-input-wrap">
          <input id="msgInput" placeholder="Message @username">
        </div>
      </div>
    </div>
  </div>
  
  <div class="call-overlay" id="callOverlay">
    <div class="call-header">
      <h2 id="callTitle">Video Call</h2>
      <div id="callStatus"><span class="status">Connecting...</span></div>
      <div id="callLeft" style="display:none;"><span class="left">User left the call</span></div>
    </div>
    <div class="video-grid">
      <div class="video-box">
        <div class="label">You</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="status">
          <span id="myVideoStatus">📹</span>
          <span id="myAudioStatus">🎤</span>
        </div>
      </div>
      <div class="video-box">
        <div class="label">Them</div>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="status">
          <span id="theirVideoStatus">📹</span>
          <span id="theirAudioStatus">🎤</span>
        </div>
      </div>
    </div>
    <div class="call-controls">
      <button class="call-btn toggle active" id="videoBtn" onclick="toggleVideo()">📹 Video</button>
      <button class="call-btn toggle active" id="audioBtn" onclick="toggleAudio()">🎤 Mute</button>
      <button class="call-btn screen" id="screenBtn" onclick="toggleScreenShare()">🖥️ Share Screen</button>
      <button class="call-btn end" onclick="endCall()">📞</button>
    </div>
  </div>
  
  <div class="incoming-call" id="incomingCall">
    <h4>Incoming call from <span id="callerName"></span></h4>
    <div class="incoming-call-buttons">
      <button class="incoming-call-btn accept" onclick="acceptCall()">Accept</button>
      <button class="incoming-call-btn reject" onclick="rejectCall()">Reject</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let currentUser = null, selectedUser = null, socket = null, currentRoomId = '';
    let incomingCallData = null;
    let localStream = null, screenStream = null;
    let peerConnection = null;
    let audioEnabled = true, videoEnabled = true;
    let sendingScreen = false;
    let isCaller = false;
    const serverUrl = window.location.origin;
    
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelay' }
      ],
      iceCandidatePoolSize: 10
    };
    
    async function login() {
      const res = await fetch(`${serverUrl}/api/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value })
      });
      const data = await res.json();
      if (data.error) showError(data.error);
      else { currentUser = data.user; initApp(); }
    }
    
    async function register() {
      const res = await fetch(`${serverUrl}/api/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value, displayName: document.getElementById('regDisplayName').value })
      });
      const data = await res.json();
      if (data.error) showError(data.error);
      else showLogin();
    }
    
    function showRegister() { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; }
    function showLogin() { document.getElementById('registerForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; }
    function showError(msg) { const el = document.getElementById('authError'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
    
    async function initApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      
      socket = io();
      socket.on('connect', () => socket.emit('register', currentUser.id));
      socket.on('message', (data) => { if (currentRoomId && currentRoomId === data.roomId && data.senderId !== currentUser.id) addMessage(data.content, data.senderId); });
      
      socket.on('call-incoming', handleIncomingCall);
      socket.on('call-accepted', handleCallAccepted);
      socket.on('call-rejected', handleCallRejected);
      socket.on('call-ended', handleCallEnded);
      socket.on('ice-candidate', handleIceCandidate);
      socket.on('peer-toggle-video', handlePeerToggleVideo);
      socket.on('peer-toggle-audio', handlePeerToggleAudio);
      socket.on('peer-screen-share', handlePeerScreenShare);
      
      loadUsers();
    }
    
    async function loadUsers() {
      const res = await fetch(`${serverUrl}/api/users`);
      const { users } = await res.json();
      document.getElementById('userList').innerHTML = users.map(u => `
        <div class="user-item" onclick="selectUser(${u.id}, '${u.displayName}', '${u.username}')">
          <div class="avatar-wrap"><div class="avatar">${u.displayName[0].toUpperCase()}</div><div class="status-dot"></div></div>
          <div class="user-name">${u.displayName}</div>
        </div>`).join('');
    }
    
    async function selectUser(userId, displayName, username) {
      selectedUser = { id: userId, displayName, username };
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.user-item').classList.add('active');
      
      document.getElementById('chatAvatar').textContent = displayName[0].toUpperCase();
      document.getElementById('chatTitle').textContent = displayName;
      document.getElementById('chatUsername').textContent = '@' + username;
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('videoHeaderBtn').style.display = 'block';
      document.getElementById('messageInput').style.display = 'block';
      document.getElementById('noChat').style.display = 'none';
      document.getElementById('msgInput').placeholder = 'Message @' + username;
      
      currentRoomId = [currentUser.id, userId].sort().join('-').toString();
      socket.emit('join-room', currentRoomId);
      document.getElementById('messages').innerHTML = '';
      const res = await fetch(`${serverUrl}/api/messages/${currentRoomId}`);
      const { messages } = await res.json();
      let lastSender = null;
      messages.forEach(msg => {
        const name = msg.senderId === currentUser.id ? currentUser.displayName : displayName;
        const isSent = msg.senderId === currentUser.id;
        if (msg.senderId !== lastSender) {
          lastSender = msg.senderId;
          renderGroup(name, msg.content, isSent);
        } else {
          addMessageText(msg.content, isSent);
        }
      });
    }
    
    function renderGroup(name, content, isSent) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message-group';
      div.innerHTML = `
        <div class="message-avatar">${name[0].toUpperCase()}</div>
        <div class="message-content">
          <div class="message-header"><span class="name">${name}</span><span class="time">Today</span></div>
          <div class="message-text"></div>
        </div>`;
      div.querySelector('.message-text').textContent = content;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }
    
    function addMessage(content, senderId) {
      if (!selectedUser) return;
      const name = senderId === currentUser.id ? currentUser.displayName : selectedUser.displayName;
      const msgs = document.getElementById('messages');
      const lastGroup = msgs.lastElementChild;
      if (lastGroup && lastGroup.querySelector('.name')) {
        const lastName = lastGroup.querySelector('.name').textContent;
        if (lastName === name) {
          const div = document.createElement('div');
          div.className = 'message-group';
          div.style.marginLeft = '56px';
          div.innerHTML = `<div class="message-text"></div>`;
          div.querySelector('.message-text').textContent = content;
          msgs.appendChild(div);
          msgs.scrollTop = msgs.scrollHeight;
          return;
        }
      }
      renderGroup(name, content, senderId === currentUser.id);
    }
    
    function addMessageText(content) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message-group';
      div.style.marginLeft = '56px';
      div.innerHTML = `<div class="message-text"></div>`;
      div.querySelector('.message-text').textContent = content;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }
    
    function sendMessage() {
      const content = document.getElementById('msgInput').value.trim();
      if (!content || !selectedUser) return;
      socket.emit('message', { roomId: currentRoomId, senderId: currentUser.id, content });
      addMessage(content, currentUser.id);
      document.getElementById('msgInput').value = '';
    }
    document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    function startCall() { if (selectedUser) startCallToUser(selectedUser.id); }
    
    async function startCallToUser(userId) {
      isCaller = true;
      currentRoomId = `call-${[currentUser.id, userId].sort().join('-')}`;
      
      document.getElementById('callStatus').style.display = 'block';
      document.getElementById('callLeft').style.display = 'none';
      document.getElementById('callStatus').innerHTML = '<span class="status">Calling...</span>';
      document.getElementById('callOverlay').classList.add('show');
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: { echoCancellation: true, noiseSuppression: true } });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.error('Media error:', err);
        endCall();
        return;
      }
      
      peerConnection = new RTCPeerConnection(rtcConfig);
      
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      
      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };
      
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', {
            to: userId,
            roomId: currentRoomId,
            candidate: event.candidate
          });
        }
      };
      
      peerConnection.oniceconnectionstatechange = () => {
        console.log('ICE state:', peerConnection.iceConnectionState);
        if (peerConnection.iceConnectionState === 'connected') {
          document.getElementById('callStatus').innerHTML = '<span class="connected">Connected</span>';
        } else if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') {
          document.getElementById('callStatus').innerHTML = '<span class="status">Connection failed. Retrying...</span>';
        }
      };
      
      peerConnection.onconnectionstatechange = () => {
        console.log('Connection state:', peerConnection.connectionState);
      };
      
      const offer = await peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
      await peerConnection.setLocalDescription(offer);
      
      socket.emit('call-user', {
        to: userId,
        from: currentUser.id,
        fromName: currentUser.displayName,
        roomId: currentRoomId,
        offer: peerConnection.localDescription
      });
    }
    
    async function handleIncomingCall(data) {
      currentRoomId = data.roomId;
      incomingCallData = data;
      document.getElementById('callerName').textContent = data.fromName || 'User';
      document.getElementById('incomingCall').classList.add('show');
    }
    
    async function acceptCall() {
      document.getElementById('incomingCall').classList.remove('show');
      
      const { from, fromName, roomId, offer } = incomingCallData;
      currentRoomId = roomId;
      isCaller = false;
      
      document.getElementById('callStatus').style.display = 'block';
      document.getElementById('callLeft').style.display = 'none';
      document.getElementById('callStatus').innerHTML = '<span class="connected">Connected</span>';
      document.getElementById('callOverlay').classList.add('show');
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: { echoCancellation: true, noiseSuppression: true } });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.error('Media error:', err);
        endCall();
        return;
      }
      
      peerConnection = new RTCPeerConnection(rtcConfig);
      
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      
      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };
      
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', {
            to: from,
            roomId: currentRoomId,
            candidate: event.candidate
          });
        }
      };
      
      peerConnection.oniceconnectionstatechange = () => {
        console.log('ICE state:', peerConnection.iceConnectionState);
        if (peerConnection.iceConnectionState === 'connected') {
          document.getElementById('callStatus').innerHTML = '<span class="connected">Connected</span>';
        } else if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') {
          document.getElementById('callStatus').innerHTML = '<span class="status">Connection failed. Retrying...</span>';
        }
      };
      
      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      
      socket.emit('accept-call', {
        to: from,
        roomId: currentRoomId,
        answer: peerConnection.localDescription
      });
      
      incomingCallData = null;
    }
    
    function rejectCall() {
      if (incomingCallData) {
        socket.emit('reject-call', { to: incomingCallData.from, roomId: currentRoomId });
      }
      document.getElementById('incomingCall').classList.remove('show');
      endCall();
      incomingCallData = null;
    }
    
    async function handleCallAccepted(data) {
      document.getElementById('callStatus').innerHTML = '<span class="connected">Connected</span>';
      const { answer } = data;
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    }
    
    function handleCallRejected() {
      showError('Call rejected');
      endCall();
    }
    
    function handleCallEnded() {
      endCall();
    }
    
    async function handleIceCandidate(data) {
      if (peerConnection && data.candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    }
    
    function handlePeerToggleVideo(data) {
      const el = document.getElementById('theirVideoStatus');
      el.textContent = data.enabled ? '📹' : '📹 Off';
      el.className = data.enabled ? '' : 'off';
      document.getElementById('remoteVideo').style.opacity = data.enabled ? 1 : 0.3;
    }
    
    function handlePeerToggleAudio(data) {
      const el = document.getElementById('theirAudioStatus');
      el.textContent = data.enabled ? '🎤' : '🎤 Muted';
      el.className = data.enabled ? '' : 'off';
    }
    
    function handlePeerScreenShare(data) {
      document.getElementById('remoteVideo').style.border = data.sharing ? '3px solid #23a559' : 'none';
    }
    
    function toggleVideo() {
      if (!localStream) return;
      videoEnabled = !videoEnabled;
      localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
      updateToggleButtons();
      socket.emit('toggle-video', { roomId: currentRoomId, enabled: videoEnabled, to: selectedUser.id });
    }
    
    function toggleAudio() {
      if (!localStream) return;
      audioEnabled = !audioEnabled;
      localStream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
      updateToggleButtons();
      socket.emit('toggle-audio', { roomId: currentRoomId, enabled: audioEnabled, to: selectedUser.id });
    }
    
    function updateToggleButtons() {
      document.getElementById('videoBtn').textContent = videoEnabled ? '📹 Video' : '📹 Video Off';
      document.getElementById('videoBtn').classList.toggle('active', videoEnabled);
      document.getElementById('audioBtn').textContent = audioEnabled ? '🎤 Mute' : '🎤 Unmute';
      document.getElementById('audioBtn').classList.toggle('active', audioEnabled);
      document.getElementById('myVideoStatus').textContent = videoEnabled ? '📹' : '📹 Off';
      document.getElementById('myAudioStatus').textContent = audioEnabled ? '🎤' : '🎤 Off';
    }
    
    async function toggleScreenShare() {
      const btn = document.getElementById('screenBtn');
      
      if (sendingScreen) {
        if (screenStream) {
          screenStream.getTracks().forEach(t => t.stop());
          screenStream = null;
        }
        sendingScreen = false;
        btn.textContent = '🖥️ Share Screen';
        btn.classList.remove('sharing');
        
        if (peerConnection && localStream) {
          const sender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
          if (sender) {
            const newTrack = localStream.getVideoTracks()[0];
            sender.replaceTrack(newTrack);
          }
        }
      } else {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          sendingScreen = true;
          btn.textContent = '🖥️ Stop Sharing';
          btn.classList.add('sharing');
          
          screenStream.getVideoTracks()[0].onended = () => {
            sendingScreen = false;
            if (screenStream) {
              screenStream.getTracks().forEach(t => t.stop());
              screenStream = null;
            }
            btn.textContent = '🖥️ Share Screen';
            btn.classList.remove('sharing');
            
            if (peerConnection && localStream) {
              const sender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
              if (sender) {
                sender.replaceTrack(localStream.getVideoTracks()[0]);
              }
            }
          };
          
          if (peerConnection) {
            const sender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
            if (sender) {
              sender.replaceTrack(screenStream.getVideoTracks()[0]);
            }
          }
        } catch (err) { console.error('Screen share error:', err); }
      }
      socket.emit('screen-share', { roomId: currentRoomId, sharing: sendingScreen, to: selectedUser.id });
    }
    
    function endCall() {
      document.getElementById('callOverlay').classList.remove('show');
      document.getElementById('callStatus').style.display = 'none';
      
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
      }
      
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      
      audioEnabled = true;
      videoEnabled = true;
      sendingScreen = false;
      
      document.getElementById('screenBtn').textContent = '🖥️ Share Screen';
      document.getElementById('screenBtn').classList.remove('sharing');
      updateToggleButtons();
      
      if (currentRoomId && currentRoomId.startsWith('call-')) {
        socket.emit('end-call', { roomId: currentRoomId });
      }
      currentRoomId = '';
    }
  </script>
</body>
</html>
