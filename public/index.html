<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }
    
    .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    .auth-box h1 { text-align: center; margin-bottom: 1.5rem; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .auth-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .auth-box .switch { text-align: center; margin-top: 1rem; color: #007bff; cursor: pointer; }
    .error { color: #dc3545; font-size: 12px; margin-bottom: 8px; display: none; }
    
    .app { display: none; height: 100vh; }
    .sidebar { width: 280px; background: white; border-right: 1px solid #e0e0e0; }
    .header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; }
    .user-item:hover { background: #f8f9fa; }
    .user-item.active { background: #e7f3ff; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #007bff; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .user-name { font-weight: 500; }
    .user-status { font-size: 12px; color: #666; }
    .call-btn { width: 32px; height: 32px; border-radius: 50%; background: #28a745; color: white; border: none; cursor: pointer; }
    
    .main { flex: 1; display: flex; flex-direction: column; background: white; }
    .chat-header { padding: 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .message.sent { align-self: flex-end; background: #007bff; color: white; }
    .message.received { align-self: flex-start; background: #e9ecef; }
    
    .message-input { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
    .message-input input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 24px; }
    .message-input button { padding: 10px 24px; background: #007bff; color: white; border: none; border-radius: 24px; cursor: pointer; }
    
    .call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; flex-direction: column; gap: 20px; z-index: 1000; }
    .call-overlay.show { display: flex; }
    .call-overlay .video-area { position: relative; }
    .call-overlay video, .call-overlay canvas { width: 400px; height: 300px; border-radius: 12px; object-fit: cover; background: #222; }
    .call-overlay .waiting { display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; background: #111; }
    .call-overlay .label { color: #888; text-align: center; margin-bottom: 4px; }
    .call-overlay .status-badge { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: flex; gap: 8px; }
    .call-overlay .status-badge span { display: flex; align-items: center; gap: 4px; }
    .call-overlay .status-badge .off { color: #dc3545; }
    .call-overlay .status-badge .on { color: #28a745; }
    .call-overlay h2 { color: white; }
    .call-overlay .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .call-overlay button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
    .call-overlay .end-btn { background: #dc3545; color: white; }
    .call-overlay .toggle-btn { background: #444; color: white; }
    .call-overlay .toggle-btn.active { background: #007bff; }
    .call-overlay .screen-btn { background: #28a745; color: white; }
    .call-overlay .screen-btn.sharing { background: #dc3545; }
    .call-overlay .participant-info { color: white; text-align: center; }
    .call-overlay .participant-info .online { color: #28a745; font-size: 12px; }
    .call-overlay .participant-info .left { color: #dc3545; font-size: 14px; font-weight: bold; }
    .call-overlay .connecting { color: #f39c12; font-size: 14px; }
    
    .incoming-call { position: fixed; bottom: 20px; right: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: none; }
    .incoming-call.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>Chat App</h1>
      <div class="error" id="authError"></div>
      <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="switch" onclick="showRegister()">Don't have an account?</div>
      </div>
      <div id="registerForm" style="display:none;">
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regDisplayName" placeholder="Display Name">
        <button onclick="register()">Sign Up</button>
        <div class="switch" onclick="showLogin()">Already have account?</div>
      </div>
    </div>
  </div>
  
  <div class="app" id="app">
    <div class="sidebar">
      <div class="header"><h2>Chat App</h2></div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="main">
      <div class="chat-header">
        <h3 id="chatTitle">Select a user</h3>
        <button id="callBtn" style="display:none;background:#28a745;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;" onclick="startCall()">Video Call</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="message-input" id="messageInput" style="display:none;">
        <input id="msgInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
  
  <div class="call-overlay" id="callOverlay">
    <div class="participant-info" id="participantInfo">
      <div id="statusText"><span class="connecting">Connecting...</span></div>
      <div id="leftStatus" style="display:none;"><span class="left">Other person left the call</span></div>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;">
      <div class="video-area">
        <div class="label">You</div>
        <video id="localVideo" autoplay playsinline muted style="transform: scaleX(-1);"></video>
        <div class="status-badge">
          <span id="myVideoStatus" class="on">📹 On</span>
          <span id="myAudioStatus" class="on">🎤 On</span>
        </div>
      </div>
      <div class="video-area">
        <div class="label">Other person</div>
        <canvas id="remoteCanvas"></canvas>
        <div class="status-badge">
          <span id="theirVideoStatus" class="on">📹 On</span>
          <span id="theirAudioStatus" class="on">🎤 On</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="toggle-btn active" id="videoBtn" onclick="toggleVideo()">📹 Video On</button>
      <button class="toggle-btn active" id="audioBtn" onclick="toggleAudio()">🎤 Audio On</button>
      <button class="screen-btn" id="screenBtn" onclick="toggleScreenShare()">🖥️ Share Screen</button>
      <button class="end-btn" onclick="endCall()">📞 End Call</button>
    </div>
  </div>
  
  <div class="incoming-call" id="incomingCall">
    <h4>Incoming call from <span id="callerName"></span></h4>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button style="background:#28a745;color:white;padding:8px 16px;border:none;cursor:pointer;" onclick="acceptCall()">Accept</button>
      <button style="background:#dc3545;color:white;padding:8px 16px;border:none;cursor:pointer;" onclick="rejectCall()">Reject</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let currentUser = null, selectedUser = null, socket = null, currentRoomId = null;
    let incomingCallData = null, localStream = null, localVideo = null;
    let remoteCanvas = null, remoteCtx = null;
    let audioEnabled = true, videoEnabled = true;
    let isCaller = false;
    let screenStream = null;
    let sendingScreen = false;
    let otherVideoOn = true, otherAudioOn = true;
    let otherJoined = false;
    let frameInterval = null;
    const serverUrl = window.location.origin;
    
    async function login() {
      const res = await fetch(`${serverUrl}/api/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value })
      });
      const data = await res.json();
      if (data.error) showError(data.error);
      else { currentUser = data.user; initApp(); }
    }
    
    async function register() {
      const res = await fetch(`${serverUrl}/api/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value, displayName: document.getElementById('regDisplayName').value })
      });
      const data = await res.json();
      if (data.error) showError(data.error);
      else showLogin();
    }
    
    function showRegister() { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; }
    function showLogin() { document.getElementById('registerForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; }
    function showError(msg) { const el = document.getElementById('authError'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
    
    async function initApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      localVideo = document.getElementById('localVideo');
      remoteCanvas = document.getElementById('remoteCanvas');
      remoteCtx = remoteCanvas.getContext('2d');
      remoteCanvas.width = 400; remoteCanvas.height = 300;
      
      socket = io();
      socket.on('connect', () => socket.emit('register', currentUser.id));
      socket.on('message', (data) => { if (currentRoomId === data.roomId && data.senderId !== currentUser.id) addMessage(data.content); });
      
      socket.on('call-request', handleCallRequest);
      socket.on('call-accepted', handleCallAccepted);
      socket.on('call-rejected', handleCallRejected);
      socket.on('call-ended', handleCallEnded);
      socket.on('user-left', handleUserLeft);
      socket.on('video-frame', handleVideoFrame);
      socket.on('toggle-video', (d) => { if (d.from !== currentUser.id) updateTheirStatus('video', d.enabled); });
      socket.on('toggle-audio', (d) => { if (d.from !== currentUser.id) updateTheirStatus('audio', d.enabled); });
      socket.on('screen-share', (d) => { if (d.from !== currentUser.id) handleTheirScreenShare(d.sharing); });
      
      loadUsers();
    }
    
    async function loadUsers() {
      const res = await fetch(`${serverUrl}/api/users`);
      const { users } = await res.json();
      document.getElementById('userList').innerHTML = users.map(u => `
        <div class="user-item" onclick="selectUser(${u.id}, '${u.displayName}')">
          <div class="avatar">${u.displayName[0].toUpperCase()}</div>
          <div class="user-info"><div class="user-name">${u.displayName}</div><div class="user-status">@${u.username}</div></div>
          <button class="call-btn" onclick="event.stopPropagation(); startCallToUser(${u.id})">📹</button>
        </div>`).join('');
    }
    
    async function selectUser(userId, displayName) {
      selectedUser = { id: userId, displayName };
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.user-item').classList.add('active');
      document.getElementById('chatTitle').textContent = displayName;
      document.getElementById('callBtn').style.display = 'block';
      document.getElementById('messageInput').style.display = 'flex';
      currentRoomId = [currentUser.id, userId].sort().join('-');
      socket.emit('join-room', currentRoomId);
      document.getElementById('messages').innerHTML = '';
      const res = await fetch(`${serverUrl}/api/messages/${currentRoomId}`);
      const { messages } = await res.json();
      messages.forEach(msg => addMessage(msg.content, msg.senderId === currentUser.id));
    }
    
    function sendMessage() {
      const content = document.getElementById('msgInput').value.trim();
      if (!content || !selectedUser) return;
      socket.emit('message', { roomId: currentRoomId, senderId: currentUser.id, content });
      addMessage(content, true);
      document.getElementById('msgInput').value = '';
    }
    document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    function addMessage(content, isSent) {
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.textContent = content;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
    
    function startCall() { if (selectedUser) startCallToUser(selectedUser.id); }
    
    async function startCallToUser(userId) {
      isCaller = true;
      currentRoomId = `call-${[currentUser.id, userId].sort().join('-')}`;
      otherJoined = false;
      
      document.getElementById('statusText').style.display = 'block';
      document.getElementById('leftStatus').style.display = 'none';
      document.getElementById('statusText').innerHTML = '<span class="connecting">Calling...</span>';
      
      remoteCtx.fillStyle = '#111';
      remoteCtx.fillRect(0, 0, 400, 300);
      remoteCtx.fillStyle = '#666';
      remoteCtx.font = '16px sans-serif';
      remoteCtx.textAlign = 'center';
      remoteCtx.fillText('Waiting for other person...', 200, 150);
      
      otherVideoOn = true; otherAudioOn = true;
      updateTheirStatus('video', true);
      updateTheirStatus('audio', true);
      
      await startMedia();
      socket.emit('call-request', { roomId: currentRoomId, from: currentUser.id, to: userId });
      document.getElementById('callOverlay').classList.add('show');
    }
    
    async function startMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        sendVideoFrames();
        updateMyStatus();
      } catch (err) { showError('Camera/mic access denied'); }
    }
    
    function sendVideoFrames() {
      if (frameInterval) clearInterval(frameInterval);
      
      const video = document.createElement('video');
      const getStream = () => sendingScreen && screenStream ? screenStream : localStream;
      
      const sendFrame = () => {
        const stream = getStream();
        if (!stream) return;
        video.srcObject = stream;
        if (video.readyState >= 2) {
          remoteCtx.drawImage(video, 0, 0, 400, 300);
          const dataUrl = remoteCanvas.toDataURL('image/jpeg', 0.6);
          socket.emit('video-frame', { roomId: currentRoomId, frame: dataUrl });
        }
      };
      
      sendFrame();
      frameInterval = setInterval(sendFrame, 80);
    }
    
    function handleCallRequest(data) {
      currentRoomId = data.roomId;
      incomingCallData = data;
      document.getElementById('callerName').textContent = data.fromName || 'User';
      document.getElementById('incomingCall').classList.add('show');
    }
    
    async function acceptCall() {
      document.getElementById('incomingCall').classList.remove('show');
      
      isCaller = false;
      otherJoined = true;
      document.getElementById('statusText').style.display = 'block';
      document.getElementById('leftStatus').style.display = 'none';
      document.getElementById('statusText').innerHTML = '<span class="online">Connected</span>';
      
      await startMedia();
      socket.emit('call-accept', { roomId: currentRoomId, from: currentUser.id });
      document.getElementById('callOverlay').classList.add('show');
      
      // Start sending frames immediately
      sendVideoFrames();
      
      incomingCallData = null;
    }
    
    function rejectCall() {
      if (incomingCallData) {
        socket.emit('call-reject', { roomId: currentRoomId, from: currentUser.id });
      }
      document.getElementById('incomingCall').classList.remove('show');
      endCall();
      incomingCallData = null;
    }
    
    function handleCallAccepted(data) {
      otherJoined = true;
      document.getElementById('statusText').innerHTML = '<span class="online">Connected</span>';
      sendVideoFrames();
    }
    
    function handleCallRejected() {
      showError('Call rejected');
      endCall();
    }
    
    function handleCallEnded() {
      document.getElementById('statusText').style.display = 'block';
      document.getElementById('leftStatus').style.display = 'none';
      endCall();
    }
    
    function handleUserLeft(data) {
      otherJoined = false;
      document.getElementById('statusText').style.display = 'none';
      document.getElementById('leftStatus').style.display = 'block';
    }
    
    function handleVideoFrame(data) {
      if (data.from !== currentUser.id && data.frame) {
        const img = new Image();
        img.onload = () => { remoteCtx.drawImage(img, 0, 0); };
        img.src = data.frame;
      }
    }
    
    function updateTheirStatus(type, enabled) {
      if (type === 'video') {
        otherVideoOn = enabled;
        const el = document.getElementById('theirVideoStatus');
        el.textContent = enabled ? '📹 On' : '📹 Off';
        el.className = enabled ? 'on' : 'off';
        remoteCanvas.style.opacity = enabled ? 1 : 0.3;
      } else {
        otherAudioOn = enabled;
        const el = document.getElementById('theirAudioStatus');
        el.textContent = enabled ? '🎤 On' : '🎤 Off';
        el.className = enabled ? 'on' : 'off';
      }
    }
    
    function updateMyStatus() {
      document.getElementById('myVideoStatus').textContent = videoEnabled ? '📹 On' : '📹 Off';
      document.getElementById('myVideoStatus').className = videoEnabled ? 'on' : 'off';
      document.getElementById('myAudioStatus').textContent = audioEnabled ? '🎤 On' : '🎤 Off';
      document.getElementById('myAudioStatus').className = audioEnabled ? 'on' : 'off';
    }
    
    function toggleVideo() {
      if (!localStream) return;
      videoEnabled = !videoEnabled;
      localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
      updateToggleButtons();
      updateMyStatus();
      socket.emit('toggle-video', { roomId: currentRoomId, enabled: videoEnabled, from: currentUser.id });
    }
    
    function toggleAudio() {
      if (!localStream) return;
      audioEnabled = !audioEnabled;
      localStream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
      updateToggleButtons();
      updateMyStatus();
      socket.emit('toggle-audio', { roomId: currentRoomId, enabled: audioEnabled, from: currentUser.id });
    }
    
    async function toggleScreenShare() {
      const btn = document.getElementById('screenBtn');
      
      if (sendingScreen) {
        if (screenStream) {
          screenStream.getTracks().forEach(t => t.stop());
          screenStream = null;
        }
        sendingScreen = false;
        btn.textContent = '🖥️ Share Screen';
        btn.classList.remove('sharing');
        sendVideoFrames();
      } else {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          sendingScreen = true;
          btn.textContent = '🖥️ Stop Sharing';
          btn.classList.add('sharing');
          
          screenStream.getVideoTracks()[0].onended = () => {
            sendingScreen = false;
            if (screenStream) {
              screenStream.getTracks().forEach(t => t.stop());
              screenStream = null;
            }
            btn.textContent = '🖥️ Share Screen';
            btn.classList.remove('sharing');
            sendVideoFrames();
          };
          
          sendVideoFrames();
        } catch (err) { console.error('Screen share error:', err); }
      }
      socket.emit('screen-share', { roomId: currentRoomId, sharing: sendingScreen, from: currentUser.id });
    }
    
    function handleTheirScreenShare(sharing) {
      document.getElementById('remoteCanvas').style.border = sharing ? '3px solid #28a745' : 'none';
    }
    
    function updateToggleButtons() {
      document.getElementById('videoBtn').textContent = videoEnabled ? '📹 Video On' : '📹 Video Off';
      document.getElementById('videoBtn').classList.toggle('active', videoEnabled);
      document.getElementById('audioBtn').textContent = audioEnabled ? '🎤 Audio On' : '🎤 Audio Off';
      document.getElementById('audioBtn').classList.toggle('active', audioEnabled);
    }
    
    function endCall() {
      document.getElementById('callOverlay').classList.remove('show');
      if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
      remoteCtx.clearRect(0, 0, 400, 300);
      audioEnabled = true; videoEnabled = true; sendingScreen = false; otherJoined = false;
      document.getElementById('screenBtn').textContent = '🖥️ Share Screen';
      document.getElementById('screenBtn').classList.remove('sharing');
      
      if (currentRoomId && currentRoomId.startsWith('call-')) {
        socket.emit('end-call', { roomId: currentRoomId });
      }
      currentRoomId = null;
    }
  </script>
</body>
</html>
